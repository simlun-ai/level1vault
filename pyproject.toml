[tool.ruff]
target-version = "py310"
line-length = 88
required-version = "==0.17.2"
# Installed Python commands have no filename extension.
extend-include = ["runtime/workspace-discover", "runtime/workspace-home", "runtime/workspace-replace", "runtime/workspace-sync", "runtime/workspace-transport-import"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Resolve shared imports consistently in both the checkout and CI source context.
known-first-party = ["artifact_owner", "live_payload", "member_recovery", "pair_records", "transport", "usb_devices", "usb_io", "upgrade_fixtures", "contracts"]

[tool.pyright]
include = ["common", "pipeline", "stages", "runtime", "integration-tests", "runtime/workspace-discover", "runtime/workspace-home", "runtime/workspace-replace", "runtime/workspace-sync", "runtime/workspace-transport-import"]
extraPaths = ["common", "stages/06-upgrade-os", "stages/06-upgrade-os/tests"]
pythonVersion = "3.10"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
strict = ["common"]
