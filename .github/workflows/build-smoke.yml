name: Full Debian Live build
on:
  pull_request:
    paths:
      - 'Makefile'
      - '.dockerignore'
      - 'pipeline/**'
      - 'stages/01-build-live/**'
      - 'stages/02-assemble-pair/**'
      - 'runtime/**'
      - 'common/**'
      - 'stages/06-upgrade-os/**'
      - '.github/workflows/build-smoke.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - '.dockerignore'
      - 'pipeline/**'
      - 'stages/01-build-live/**'
      - 'stages/02-assemble-pair/**'
      - 'runtime/**'
      - 'common/**'
      - 'stages/06-upgrade-os/**'
      - '.github/workflows/build-smoke.yml'
permissions:
  contents: read
concurrency:
  group: full-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --allow-insecure-entitlement security.insecure
      - name: Build real Debian Live ISO and boot images
        run: make build SUDO=
      - name: Inspect target ZFS module, initramfs and image artifacts
        run: make check-build SUDO=
      - name: Export and validate OS upgrade metadata from the inspected ISO
        run: |
          bash pipeline/buildkit.sh release build/default build/default/upgrade
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "stages/06-upgrade-os"); import upgrade; upgrade.load_release(Path("build/default/upgrade").resolve())'
      - name: Verify host ownership and checkout BuildKit cleanup
        run: |
          test -z "$(find build/default ! -uid "$(id -u)" -print -quit)"
          builder=$(python3 pipeline/lifecycle.py builder-name)
          make clean
          test -z "$(docker volume ls -q --filter "name=buildx_buildkit_${builder}0_state")"
          test -f build/default/upgrade/UPGRADE-READY
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-build-diagnostics
          if-no-files-found: ignore
          path: |
            build/default/build.log
            build/default/builder-info.txt
            build/default/build-metadata.json
            build/default/live/live-build.log
            build/default/upgrade/live/release.json
            build/default/pairs/1/BUILD-INFO.txt
            build/default/pairs/1/images.json
