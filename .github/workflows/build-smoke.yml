name: Full Debian Live build
on:
  pull_request:
    paths:
      - 'Makefile'
      - '.dockerignore'
      - 'docker-bake.hcl'
      - 'pipeline/**'
      - 'stages/01-build-live/**'
      - 'stages/02-assemble-pair/**'
      - 'runtime/**'
      - 'common/**'
      - 'stages/06-upgrade-os/**'
      - 'stages/07-replace-member/**'
      - '.github/workflows/build-smoke.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - '.dockerignore'
      - 'docker-bake.hcl'
      - 'pipeline/**'
      - 'stages/01-build-live/**'
      - 'stages/02-assemble-pair/**'
      - 'runtime/**'
      - 'common/**'
      - 'stages/06-upgrade-os/**'
      - 'stages/07-replace-member/**'
      - '.github/workflows/build-smoke.yml'
permissions:
  contents: read
concurrency:
  group: full-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --allow-insecure-entitlement security.insecure
      - name: Build, inspect and verify lifecycle contracts
        run: make ci-build SUDO=
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-build-diagnostics
          if-no-files-found: ignore
          path: |
            build/default/build.log
            build/default/builder-info.txt
            build/default/build-metadata.json
            build/default/live/live-build.log
            build/default/upgrade/live/release.json
            build/default/pairs/1/BUILD-INFO.txt
            build/default/pairs/1/images.json
