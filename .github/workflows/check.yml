name: Check scripts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck ./*.sh docker/*.sh tests/*.sh live/mount-workspace live/90-zfs.hook.chroot
      - run: for f in ./*.sh docker/*.sh tests/*.sh; do bash -n "$f"; done
      - run: sh -n live/mount-workspace live/90-zfs.hook.chroot
      - run: python3 -m unittest discover -s tests -v
  container-assembly:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t level1vault-builder:test -f docker/Dockerfile docker
      # This stage must work unprivileged: no host ZFS or loop devices exposed.
      - run: docker run --rm --mount "type=bind,source=$PWD,target=/src,readonly" level1vault-builder:test bash /src/tests/test_assembly.sh
