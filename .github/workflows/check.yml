name: Check scripts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - run: make ci SUDO=
  zfs-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y zfsutils-linux gdisk dosfstools fdisk mtools
      - name: Exercise encryption and replication on disposable file-backed mirrors
        run: make ci-zfs LEVEL1VAULT_DISPOSABLE_TEST_VM=1
