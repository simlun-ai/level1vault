name: Check scripts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make test
  container-assembly:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          name: level1vault
          buildkitd-flags: --allow-insecure-entitlement security.insecure
      # No insecure RUN entitlement is requested for these test stages.
      - run: make test-container SUDO=
  zfs-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zfsutils-linux gdisk
      - name: Exercise encryption and replication on disposable file-backed mirrors
        run: make test-zfs LEVEL1VAULT_DISPOSABLE_TEST_VM=1
