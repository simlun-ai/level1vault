name: Check scripts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make test
  container-assembly:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Assembly and account tests run without privileged containers.
      - run: make test-container
  zfs-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zfsutils-linux gdisk
      - name: Exercise encryption and replication on disposable file-backed mirrors
        run: make test-zfs LEVEL1VAULT_DISPOSABLE_TEST_VM=1
